<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#172554" />
    <meta name="description" content="친구들과 주간 공부시간을 계획하고 공유하는 모바일 시간표" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css?v=6" />
    <title>공부불씨</title>
  </head>
  <body>
    <header class="app-header">
      <div class="brand-row">
        <div class="brand-mark" aria-hidden="true">火</div>
        <div>
          <p class="eyebrow">함께 만드는 일주일</p>
          <h1>공부불씨</h1>
        </div>
        <button id="openSettings" class="icon-button" type="button" aria-label="설정 열기">⚙</button>
      </div>
      <div class="group-row">
        <div class="group-identity">
          <strong id="groupName">나의 공부방</strong>
          <select id="groupSwitcher" class="group-switcher" aria-label="현재 그룹 선택" hidden></select>
          <span id="connectionBadge" class="status-badge demo">체험 모드</span>
        </div>
        <button id="inviteButton" class="secondary-button" type="button">초대링크</button>
      </div>
    </header>

    <main>
      <section class="summary-card" aria-label="주간 공부시간 요약">
        <div>
          <span>이번 주 계획</span>
          <strong id="weeklyHours">0시간</strong>
        </div>
        <div>
          <span>오늘 계획</span>
          <strong id="todayHours">0시간</strong>
        </div>
        <div>
          <span>공부 블록</span>
          <strong id="blockCount">0개</strong>
        </div>
      </section>

      <section class="member-section" aria-label="그룹 구성원">
        <div class="section-heading">
          <h2>그룹원</h2>
          <span id="syncStatus">이 기기에 저장됨</span>
        </div>
        <div id="memberTabs" class="member-tabs" role="tablist"></div>
      </section>

      <section class="schedule-card">
        <div class="schedule-toolbar">
          <div>
            <h2 id="scheduleTitle">내 공부시간표</h2>
            <p id="modeHint">블록을 누르면 공부 내용을 적을 수 있어요.</p>
          </div>
          <div class="toolbar-actions">
            <button id="focusTimetable" class="secondary-button" type="button">시간표만 보기</button>
            <button id="mealButton" class="secondary-button" type="button">식사시간</button>
          </div>
        </div>

        <div class="mode-switch" role="group" aria-label="시간표 편집 방식">
          <button class="mode-button active" type="button" data-mode="plan">계획 보기</button>
          <button class="mode-button" type="button" data-mode="unavailable">수업·일정</button>
          <button class="mode-button" type="button" data-mode="study">공부시간 수정</button>
        </div>

        <div class="legend" aria-label="색상 범례">
          <span><i class="legend-study"></i>공부시간</span>
          <span><i class="legend-meal"></i>식사</span>
          <span><i class="legend-busy"></i>수업·일정</span>
          <span><i class="legend-off"></i>휴식</span>
        </div>

        <div id="scheduleScroller" class="schedule-scroller" tabindex="0" aria-label="주간 공부시간표. 좌우로 스크롤할 수 있습니다.">
          <div id="scheduleGrid" class="schedule-grid"></div>
        </div>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <dialog id="subjectDialog" class="app-dialog">
      <form method="dialog" id="subjectForm">
        <div class="dialog-heading">
          <div>
            <p class="eyebrow" id="subjectTime">월요일 09:00–10:00</p>
            <h2>무엇을 공부할까요?</h2>
          </div>
          <button class="icon-button" value="cancel" aria-label="닫기">×</button>
        </div>
        <label>
          공부 내용
          <input id="subjectInput" maxlength="40" autocomplete="off" placeholder="예: 민법 사례집 1~20번" />
        </label>
        <label>
          적용 시간
          <span class="subject-range-control">
            <strong id="subjectStart">09:00</strong>
            <span>부터</span>
            <select id="subjectEnd" aria-label="공부 내용 적용 종료시간"></select>
            <span>까지</span>
          </span>
        </label>
        <div class="quick-subjects">
          <button type="button" data-subject="민법">민법</button>
          <button type="button" data-subject="형법">형법</button>
          <button type="button" data-subject="사례풀이">사례풀이</button>
          <button type="button" data-subject="복습">복습</button>
        </div>
        <div class="dialog-actions">
          <button id="clearSubject" class="text-button" type="button">내용 지우기</button>
          <button class="primary-button" value="save">저장</button>
        </div>
      </form>
    </dialog>

    <dialog id="mealDialog" class="app-dialog">
      <form method="dialog" id="mealForm">
        <div class="dialog-heading">
          <div>
            <p class="eyebrow">기본 제외시간</p>
            <h2>식사시간 조정</h2>
          </div>
          <button class="icon-button" value="cancel" aria-label="닫기">×</button>
        </div>
        <div id="mealFields" class="meal-fields"></div>
        <p class="dialog-note">식사시간은 모든 요일에 동일하게 적용돼요. 30분 단위로 조정할 수 있습니다.</p>
        <div class="dialog-actions end">
          <button class="primary-button" value="save">적용</button>
        </div>
      </form>
    </dialog>

    <dialog id="settingsDialog" class="app-dialog">
      <form method="dialog" id="settingsForm">
        <div class="dialog-heading">
          <div>
            <p class="eyebrow">내 정보와 그룹</p>
            <h2>설정</h2>
          </div>
          <button class="icon-button" value="cancel" aria-label="닫기">×</button>
        </div>
        <label>
          내 이름
          <input id="displayNameInput" maxlength="16" autocomplete="name" />
        </label>
        <div id="sharedGroupActions" class="settings-actions">
          <button id="createGroupButton" type="button" class="secondary-button">새 그룹 만들기</button>
          <button id="joinGroupButton" type="button" class="secondary-button">초대코드로 참여</button>
        </div>
        <div class="danger-zone">
          <button id="resetSchedule" type="button" class="text-button danger">내 시간표 기본값으로 초기화</button>
          <button id="leaveGroupButton" type="button" class="text-button danger" hidden>현재 그룹 나가기</button>
        </div>
        <div class="dialog-actions end">
          <button class="primary-button" value="save">저장</button>
        </div>
      </form>
    </dialog>

    <dialog id="groupDialog" class="app-dialog">
      <form method="dialog" id="groupForm">
        <div class="dialog-heading">
          <div>
            <p class="eyebrow" id="groupDialogEyebrow">함께 공부하기</p>
            <h2 id="groupDialogTitle">새 그룹 만들기</h2>
          </div>
          <button class="icon-button" value="cancel" aria-label="닫기">×</button>
        </div>
        <label id="groupNameLabel">
          그룹 이름
          <input id="groupNameInput" maxlength="24" placeholder="예: 변시 D-100" />
        </label>
        <label id="inviteCodeLabel" hidden>
          초대코드
          <input id="inviteCodeInput" maxlength="12" autocapitalize="characters" placeholder="예: A1B2C3D4" />
        </label>
        <p id="groupDialogNote" class="dialog-note"></p>
        <div class="dialog-actions end">
          <button id="groupSubmit" class="primary-button" value="submit">만들기</button>
        </div>
      </form>
    </dialog>

    <dialog id="leaveDialog" class="app-dialog leave-dialog">
      <form method="dialog" id="leaveForm">
        <div class="dialog-heading">
          <div>
            <p class="eyebrow">되돌릴 수 없는 작업</p>
            <h2>그룹에서 나갈까요?</h2>
          </div>
          <button class="icon-button" value="cancel" aria-label="닫기">×</button>
        </div>
        <p id="leaveWarning" class="leave-warning"></p>
        <div class="dialog-actions leave-actions">
          <button class="secondary-button" value="cancel">아니요</button>
          <button id="confirmLeave" class="danger-button" type="button">예</button>
        </div>
      </form>
    </dialog>

    <script src="./config.js?v=2"></script>
    <script type="module" src="./app.js?v=6"></script>
  </body>
</html>
